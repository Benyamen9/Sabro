# Dependabot watches Docker image tags, GitHub Actions, NuGet and npm, and opens
# a PR when something newer exists — updates stay deliberate (PRs are reviewed and
# merged by hand, **never auto-merged**; that rule was broken once, on the
# Meilisearch bump #132, and it took the whole site down).
#
# Routine minor/patch moves are grouped into one PR per ecosystem per week.
# Majors are left ungrouped so each arrives on its own and gets its own decision.
#
# Two images need their runbook on merge:
#   - svhd/logto: bump the tag, then run `npm run alteration deploy` on the VPS
#     before restarting (see the Logto upgrade notes in docker-compose.prod.yml).
#   - getmeili/meilisearch: after rollout, rebuild indexes from Postgres via the
#     admin endpoints if the engine refuses the existing data directory.
version: 2
updates:
  # Service images in both compose files (dev + prod): postgres, meilisearch,
  # logto, caddy, seq. The GHCR sabro-*/meltho images use variable tags pinned
  # by CD and are ignored by Dependabot automatically.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # A postgres major bump cannot be applied by swapping the image — the
      # data directory format changes and the container refuses to boot on the
      # existing volume. Majors need a planned dump/restore, not a tag PR.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # Base images in the three Dockerfiles (API/migrator, frontend, backup).
  - package-ecosystem: "docker"
    directories:
      - "/src/Sabro.API"
      - "/frontend"
      - "/backup"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Same rationale as the compose-file rule: the backup sidecar's postgres
      # base image stays on the database's major (client tools may lead the
      # server by a major, but keeping them in lockstep removes the question).
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Node majors are NOT safe to take from a tag PR. Dependabot offers the
      # newest tag, which is whatever `node:<n>` exists — including odd-numbered
      # releases that never become LTS. It offered 22 -> 25 on 2026-08-26 (#227,
      # closed): Node 25 is odd, so it was never LTS, and its support had already
      # ended on 2026-06-01 — a bump straight onto an unsupported runtime.
      #
      # CLAUDE.md specifies Node LTS. Take these deliberately: 22 is supported to
      # 2027-04-30, 24 to 2028-04-30, and 26 becomes LTS on 2026-10-28. Minor and
      # patch bumps within the pinned major still arrive as normal.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Action pins in the CI/CD workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"

  # NuGet, via Central Package Management — every version lives in
  # Directory.Packages.props, so that one file is what Dependabot edits.
  #
  # Until 2026-08-25 nothing watched NuGet or npm here, which is why the drift in
  # the worklist accumulated by hand rather than arriving as PRs.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # One PR a week for the routine moves. The Microsoft.Extensions/EF Core set
      # is sixteen packages that always release together on the same patch — as
      # separate PRs that is sixteen builds and sixteen merges for one decision.
      # Majors stay ungrouped on purpose: each is its own migration.
      dotnet-minor-and-patch:
        update-types: ["minor", "patch"]
        # Kept out of the group because "minor" lies for these two, and a
        # breaking change hidden inside a batch of Microsoft patches is the
        # worst place to meet it.
        #
        # Meilisearch is 0.x, where minor IS the breaking channel: 0.18 -> 0.20
        # changed Settings.FilterableAttributes from string[] to
        # IEnumerable<FilterableAttribute> and failed the build (#232). Markdig
        # 1.1 -> 1.3 is likewise a real API move, not a patch. Both are already
        # listed in the worklist as wanting a PR of their own.
        exclude-patterns:
          - "Meilisearch"
          - "Markdig"
    ignore:
      # Pinned to 2.x deliberately: that is the line Microsoft.AspNetCore.OpenApi
      # 10.0.0 is compatible with. 3.x is not an upgrade we can take on its own,
      # so a major PR here would be reopened and rejected every release.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  # The hub frontend. TreatWarningsAsErrors has no npm equivalent, but CI runs
  # typecheck, Vitest and Playwright, so a bad bump surfaces there.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dev-minor-and-patch:
        update-types: ["minor", "patch"]
