name: sabro-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Sabro.slnx

      - name: Build
        run: dotnet build Sabro.slnx --no-restore --configuration Release

      - name: Verify OpenAPI spec is up to date
        # The build emits frontend/openapi/Sabro.API.json via
        # Microsoft.Extensions.ApiDescription.Server. Fail if the committed
        # spec drifts from what the current sources produce — forces backend
        # DTO changes to be paired with a regenerated spec.
        run: git diff --exit-code frontend/openapi/Sabro.API.json

      - name: Format check
        run: dotnet format Sabro.slnx --verify-no-changes --no-restore

      - name: Unit tests
        run: dotnet test tests/Sabro.UnitTests/Sabro.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=unit.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Integration tests
        run: dotnet test tests/Sabro.IntegrationTests/Sabro.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=integration.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./TestResults/**/coverage.cobertura.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./TestResults/*.trx

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # --legacy-peer-deps works around a known npm 10.x bug where optional
        # peerDependencies (e.g. @bomb.sh/tab declaring cac@^6.7.14 and
        # commander@^13.1.0 as optional peers) are incorrectly required by
        # `npm ci`. npm 11+ handles this correctly, but Node 22.22.x on the
        # runner ships with npm 10.
        run: npm ci --legacy-peer-deps

      - name: Verify generated API types are up to date
        # Regenerate api.generated.ts from the committed OpenAPI spec and
        # fail if it differs from the committed file. Catches the case where
        # someone updates the spec but forgets to regenerate types.
        run: |
          npm run generate:api-types
          git diff --exit-code app/types/api.generated.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy-safety:
    name: Deploy safety (compose + data upgrade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Dummy values for every `${VAR:?...}` in the prod compose. These assert
      # the file *parses*; they are not secrets and never reach a real service.
      - name: Write dummy env
        run: |
          cat > .env.ci <<'ENV'
          CADDY_ACME_EMAIL=ci@example.com
          POSTGRES_PASSWORD=x
          MEILI_MASTER_KEY=x
          LOGTO_DB_PASSWORD=x
          SABRO_API_RESOURCE=x
          NUXT_LOGTO_APP_ID=x
          NUXT_LOGTO_APP_SECRET=x
          NUXT_LOGTO_COOKIE_ENCRYPTION_KEY=x
          MELTHO_LOGTO_APP_ID=x
          MELTHO_LOGTO_APP_SECRET=x
          MELTHO_LOGTO_COOKIE_ENCRYPTION_KEY=x
          MNO_LOGTO_APP_ID=x
          MNO_LOGTO_APP_SECRET=x
          MNO_LOGTO_COOKIE_ENCRYPTION_KEY=x
          SHMO_LOGTO_APP_ID=x
          SHMO_LOGTO_APP_SECRET=x
          SHMO_LOGTO_COOKIE_ENCRYPTION_KEY=x
          NAHLO_LOGTO_APP_ID=x
          NAHLO_LOGTO_APP_SECRET=x
          NAHLO_LOGTO_COOKIE_ENCRYPTION_KEY=x
          ENV

      # The dummy env above and the -e flags below are hand-kept lists, and a new
      # service is added by editing the compose file or the Caddyfile — not them.
      # That gap has already cost two red builds on one branch: a `:?` variable
      # aborts compose at PARSE time (taking the whole file, not one service), and
      # an unset Caddy domain silently becomes a keyless block that Caddy reads as
      # global config. Assert the lists cover what the files actually require, so
      # the next omission is named rather than debugged.
      - name: Deploy-safety inputs cover the files
        run: |
          set -euo pipefail
          missing_env=$(comm -23             <(grep -oE '\$\{[A-Z_]+:\?' docker-compose.prod.yml | sed 's/\${//; s/:?//' | sort -u)             <(sed 's/^[[:space:]]*//' .env.ci | grep -oE '^[A-Z_]+=' | tr -d '=' | sort -u))
          # SABRO_IMAGE_TAG is supplied inline by the step below, not by .env.ci.
          missing_env=$(echo "$missing_env" | grep -v '^SABRO_IMAGE_TAG$' || true)
          if [ -n "$missing_env" ]; then
            echo "::error::Required compose variables missing from the CI env: $missing_env"
            exit 1
          fi
          missing_domain=$(comm -23             <(grep -oE '^\{\$[A-Z_]+\}' Caddyfile | tr -d '{$}' | sort -u)             <(grep -oE '\-e [A-Z_]+_DOMAIN=' "$GITHUB_WORKFLOW_REF_FILE" | sed 's/-e //; s/=//' | sort -u))
          if [ -n "$missing_domain" ]; then
            echo "::error::Caddy site blocks with no domain in the validate step: $missing_domain"
            exit 1
          fi
          echo "OK: every required compose variable and Caddy domain is covered."
        env:
          GITHUB_WORKFLOW_REF_FILE: .github/workflows/sabro-ci.yml

      - name: Prod compose parses with a pinned image tag
        run: |
          set -euo pipefail
          SABRO_IMAGE_TAG=ci-parse-check \
            docker compose --env-file .env.ci -f docker-compose.prod.yml config >/dev/null
          echo "OK: docker-compose.prod.yml parses."

      # A Caddyfile typo takes down every hostname in the ecosystem at once.
      # CD *does* ship the Caddyfile (scp + `caddy reload`), so a bad edit reaches
      # the live reverse proxy on merge — `caddy reload` keeps the old config if
      # the new one is invalid, but this step is what stops it getting that far.
      # Validate with the same Caddy image the stack runs.
      - name: Caddyfile is valid
        run: |
          set -euo pipefail
          image=$(sed -n 's|.*image: \(caddy:[^[:space:]]*\).*|\1|p' docker-compose.prod.yml | head -1)
          echo "Validating the Caddyfile against $image"
          docker run --rm \
            -e CADDY_ACME_EMAIL=ci@example.com \
            -e SABRO_DOMAIN=sabro.test \
            -e SABRO_API_DOMAIN=api.sabro.test \
            -e LOGTO_DOMAIN=auth.sabro.test \
            -e LOGTO_ADMIN_DOMAIN=admin.sabro.test \
            -e MELTHO_DOMAIN=meltho.sabro.test \
            -e MNO_DOMAIN=mno.sabro.test \
            -e SHMO_DOMAIN=shmo.sabro.test \
            -e NAHLO_DOMAIN=nahlo.sabro.test \
            -e ANALYTICS_DOMAIN=analytics.sabro.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "OK: Caddyfile is valid."

      # Locks in the fix from the 2026-07-28 incident: a hand-run `up -d` that
      # forgot --env-file resolved ${SABRO_IMAGE_TAG:-latest} to a stale cached
      # image and silently rolled production back two weeks, with every health
      # check still green. A missing tag must fail, not fall back.
      - name: Image tag must not silently fall back
        run: |
          set -euo pipefail
          if err=$(docker compose --env-file .env.ci -f docker-compose.prod.yml config 2>&1); then
            echo "::error::docker-compose.prod.yml resolved with no SABRO_IMAGE_TAG set. Restore the ':?' guard — a fallback lets a deploy serve a stale image (2026-07-28 incident)."
            exit 1
          fi
          case "$err" in
            *SABRO_IMAGE_TAG*) echo "OK: a missing SABRO_IMAGE_TAG fails the compose file." ;;
            *) echo "::error::compose failed, but not on SABRO_IMAGE_TAG:"; echo "$err"; exit 1 ;;
          esac

      # The disk-headroom check is the only sensor that would have caught the
      # 2026-07-31 fill before it took Postgres down, and it runs from cron inside a
      # container — where a broken script or a mistyped crontab line fails silently
      # and looks exactly like "disk is fine". Exercise both branches for real.
      - name: Disk-headroom check works in the backup image
        run: |
          set -euo pipefail
          docker build -t sabro-backup-ci ./backup
          docker volume create disk-check-ci >/dev/null

          run_check() {
            docker run --rm -e DISK_USAGE_THRESHOLD="$1" -v disk-check-ci:/backups \
              --entrypoint disk-check.sh sabro-backup-ci
          }

          # A threshold no filesystem can reach: the healthy path must exit 0.
          if ! out=$(run_check 100); then
            echo "::error::disk-check.sh failed on a disk with headroom:"; echo "$out"; exit 1
          fi
          echo "$out"

          # A threshold every filesystem exceeds: the alert path must exit non-zero,
          # which is what pings <heartbeat>/fail and sends the mail.
          if out=$(run_check 0); then
            echo "::error::disk-check.sh reported OK past its threshold — a full disk would never alert."
            echo "$out"; exit 1
          fi
          echo "$out"

          # cron ignores a line it cannot parse without a word of complaint, so the
          # script passing above proves nothing about it ever being run.
          docker run --rm --entrypoint sh sabro-backup-ci -c \
            'grep -q "disk-check.sh" /etc/crontabs/root && test -x /usr/local/bin/disk-check.sh'

          docker volume rm disk-check-ci >/dev/null
          echo "OK: disk-check.sh alerts past its threshold and is scheduled."

      # The gate that would have caught PR #132. A data-bearing engine bump can
      # pass every build/test and still refuse the on-disk format already sitting
      # on the production volume. Booting the stack fresh proves nothing, so this
      # boots the OLD version, writes data, then starts the NEW version on that
      # SAME volume — exactly what happens on deploy.
      - name: Meilisearch upgrade test (only when the tag changes)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"

          extract() { sed -n 's|.*image: getmeili/meilisearch:\([^[:space:]]*\).*|\1|p' | head -1; }
          old=$(git show "origin/$BASE_REF:docker-compose.prod.yml" 2>/dev/null | extract || true)
          new=$(extract < docker-compose.prod.yml)

          if [ -z "$old" ] || [ "$old" = "$new" ]; then
            echo "Meilisearch tag unchanged ($new) — skipping upgrade test."
            exit 0
          fi

          echo "Meilisearch $old -> $new: testing the new engine against an $old data directory."

          # Throwaway, but MEILI_ENV=production rejects a master key under 16
          # bytes — a short one makes the *baseline* fail and the gate go red
          # for the wrong reason. Keep this at 32 characters.
          KEY=ci-test-master-key-32-bytes-long

          docker volume create meili-upgrade-test >/dev/null

          wait_healthy() {
            for _ in $(seq 1 30); do
              if docker exec "$1" wget -q --spider http://127.0.0.1:7700/health 2>/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          docker run -d --name meili-old -v meili-upgrade-test:/meili_data \
            -e MEILI_MASTER_KEY="$KEY" -e MEILI_ENV=production \
            "getmeili/meilisearch:$old" >/dev/null
          wait_healthy meili-old || { echo "::error::Baseline meilisearch:$old never became healthy."; docker logs meili-old | tail -20; exit 1; }

          # Populate it so the volume carries a real, versioned on-disk format.
          docker exec meili-old wget -qO- \
            --header="Authorization: Bearer $KEY" \
            --header="Content-Type: application/json" \
            --post-data='{"uid":"lexicon","primaryKey":"id"}' \
            http://127.0.0.1:7700/indexes >/dev/null
          sleep 3
          docker stop meili-old >/dev/null

          docker run -d --name meili-new -v meili-upgrade-test:/meili_data \
            -e MEILI_MASTER_KEY="$KEY" -e MEILI_ENV=production \
            "getmeili/meilisearch:$new" >/dev/null
          if wait_healthy meili-new; then
            echo "OK: meilisearch:$new starts cleanly on a :$old data directory."
            exit 0
          fi

          echo "::error::meilisearch:$new refuses the :$old data directory, so this bump will take production down on deploy (the api/frontend swap aborts on the unhealthy dependency). Plan the rollout: wipe the meilisearch volume during the deploy window and rebuild indexes from Postgres via /api/v1/admin/search/rebuild/lexicon, which is the documented ritual. See the 2026-07-28 incident."
          docker logs meili-new 2>&1 | tail -20
          exit 1
