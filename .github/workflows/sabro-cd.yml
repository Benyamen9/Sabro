name: sabro-cd

# Continuous deployment: build the API, migrator, and frontend images, push them
# to GHCR tagged with the commit SHA, then SSH to the VPS to migrate and swap
# containers. Gated on a green sabro-ci run for the same commit on main — a red
# CI never triggers a deploy.
#
# Two ways in:
#   * workflow_run — the normal path. CI finishes green on main, this fires.
#   * workflow_dispatch — the manual path, for when the automatic one did not
#     happen at all. On 2026-08-06 a GitHub Actions outage meant no workflow run
#     was ever created for a merge commit, so CD never fired and production sat
#     behind main with no sanctioned way to catch it up: push events are not
#     replayed, and there was nothing to re-run. The alternative people reach for
#     is SSHing to the VPS and running `docker compose up -d` by hand, which is
#     exactly how prod once served a two-week-old image with health green.
#
# The manual path deploys through the same jobs as the automatic one and is held
# to the same rule — see "Verify CI passed" below. It is a way to re-run a
# deploy, never a way to skip CI.

on:
  workflow_run:
    workflows: ["sabro-ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA to deploy. Must be on main and have a green sabro-ci run."
        required: true
        type: string

# Only build for a successful CI run; never deploy a red build.
# `actions: read` is what lets the manual path look up whether CI passed.
permissions:
  contents: read
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  # The exact commit that passed CI — both images and deploy pin to it.
  # workflow_run supplies it; on a manual dispatch that context is empty and the
  # typed input takes over.
  SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}

jobs:
  build-and-push:
    name: Build + push images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ env.SHA }}
    steps:
      # The whole safety of the manual path. workflow_run is gated by
      # definition — it only fires on a green CI run — so this re-establishes the
      # identical guarantee for a dispatch, before anything is built or shipped.
      #
      # "On main" is the part that is easy to get wrong: sabro-ci also runs on
      # pull requests, so checking only "some green run exists for this SHA"
      # would make any green feature-branch commit deployable to production.
      # Only a run whose head_branch is main counts.
      - name: Verify CI passed for this commit on main
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          # A short SHA would build and push happily and then fail the
          # post-deploy /version assertion, which compares the full 40 characters.
          if ! printf '%s' "$DISPATCH_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character lowercase commit SHA, got '$DISPATCH_SHA'."
            exit 1
          fi

          runs=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/sabro-ci.yml/runs?head_sha=$DISPATCH_SHA&per_page=100" \
            --jq '[.workflow_runs[]
                   | select(.head_branch == "main" and .conclusion == "success")]
                  | length')

          if [ "$runs" -eq 0 ]; then
            echo "::error::No successful sabro-ci run for $DISPATCH_SHA on main. Refusing to deploy."
            echo "::error::Get CI green for this commit first — this path re-runs a deploy, it does not skip CI."
            exit 1
          fi

          echo "Verified: $runs successful sabro-ci run(s) for $DISPATCH_SHA on main."

      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image namespace
        id: ns
        run: echo "value=$(echo '${{ env.IMAGE_NAMESPACE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # API runtime image (context = repo root). BUILD_SHA is served at /version
      # and asserted by the deploy job after the swap.
      - name: Build + push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Sabro.API/Dockerfile
          target: runtime
          push: true
          build-args: |
            BUILD_SHA=${{ env.SHA }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.value }}/sabro-api:${{ env.SHA }}
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.value }}/sabro-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Guards the media-volume contract the api service depends on: a named
      # volume mounted at /app/wwwroot/media must be writable by the image's
      # non-root user and must keep its contents across container recreation.
      # Two failure modes, both invisible in production until an owner uploads a
      # pronunciation and it either 500s or silently disappears on the next
      # deploy:
      #   1. the mount point does not exist in the image, so Docker creates the
      #      volume root-owned and the uid-1001 runtime user cannot write to it;
      #   2. the directory stops shipping (e.g. the tracked .gitkeep is removed,
      #      or the publish output no longer carries wwwroot), which is the same
      #      thing by another route.
      # Runs against the exact image about to be deployed, and gates `deploy`.
      - name: Verify media volume is writable and persists
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.ns.outputs.value }}/sabro-api:${{ env.SHA }}"
          docker pull "$IMAGE"
          docker volume create sabro-media-probe

          # Fresh volume. No --user override: this is exactly the user the api
          # container runs as in production.
          docker run --rm -v sabro-media-probe:/app/wwwroot/media --entrypoint sh "$IMAGE" -c '
            echo "runtime uid: $(id -u)"
            if [ ! -d /app/wwwroot/media/pronunciations ]; then
              echo "FAIL: pronunciations directory is not in the image, so the named volume is created root-owned and uploads cannot be written"
              exit 1
            fi
            if ! echo probe > /app/wwwroot/media/pronunciations/ci.probe; then
              echo "FAIL: the runtime user cannot write into the mounted media volume"
              exit 1
            fi
          '

          # A second container over the same volume is what a redeploy does.
          docker run --rm -v sabro-media-probe:/app/wwwroot/media --entrypoint sh "$IMAGE" -c '
            if [ ! -f /app/wwwroot/media/pronunciations/ci.probe ]; then
              echo "FAIL: media written by the previous container did not survive recreation"
              exit 1
            fi
            echo "media volume OK: writable by uid $(id -u) and persistent across container recreation"
          '

          docker volume rm sabro-media-probe

      # Migrator image — same Dockerfile, migrator target.
      - name: Build + push migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Sabro.API/Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.value }}/sabro-migrator:${{ env.SHA }}
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.value }}/sabro-migrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Backup sidecar (context = ./backup): nightly dumps + off-site sync +
      # weekly restore test. Tiny image, but pinned to the same SHA so the
      # deployed stack is fully reproducible from one tag.
      - name: Build + push backup
        uses: docker/build-push-action@v7
        with:
          context: ./backup
          file: backup/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.value }}/sabro-backup:${{ env.SHA }}
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.value }}/sabro-backup:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image (context = ./frontend). The API resource must be baked in
      # at build time (it feeds the Logto `resources` array in nuxt.config).
      - name: Build + push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NUXT_PUBLIC_SABRO_API_RESOURCE=${{ secrets.NUXT_PUBLIC_SABRO_API_RESOURCE }}
            NUXT_PUBLIC_COOKIE_DOMAIN=${{ vars.COOKIE_DOMAIN || '.sabro.be' }}
            BUILD_SHA=${{ env.SHA }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.value }}/sabro-frontend:${{ env.SHA }}
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.value }}/sabro-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      # Ship the compose file AND the Caddyfile with every deploy so the VPS
      # copies can never drift from the repo. The SSH step reloads Caddy in
      # place afterward so a shipped Caddyfile change takes effect — the
      # container mounts it but only re-reads it on a caddy reload. CI's
      # deploy-safety gate has already run `caddy validate` on this file, and
      # `caddy reload` validates again and keeps the running config if the new
      # one is bad, so a broken Caddyfile fails loudly without dropping the proxy.
      - name: Ship compose file and Caddyfile to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: ${{ secrets.APP_DIR }}

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # APP_DIR holds docker-compose.prod.yml, Caddyfile, and the .env.
          # Pin the image tag to this commit, migrate first, then swap.
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_DIR }}"
            echo "SABRO_IMAGE_TAG=${{ needs.build-and-push.outputs.tag }}" > .env.deploy
            COMPOSE="docker compose --env-file .env --env-file .env.deploy -f docker-compose.prod.yml"
            $COMPOSE pull
            # Apply migrations before swapping app containers (expand->migrate->contract).
            $COMPOSE --profile migrate run --rm migrator
            # Bring the stack up and drop orphaned containers, then force the app
            # services onto the just-pulled image WITHOUT disturbing the data
            # services (--no-deps). A plain `up -d` can leave a stale api/frontend
            # container serving after an image bump; --force-recreate guarantees
            # the swap, and --remove-orphans clears any leftover from an earlier run.
            $COMPOSE up -d --remove-orphans
            $COMPOSE up -d --force-recreate --no-deps api frontend
            # Record exactly which image the api service ended up on (deploy observability).
            $COMPOSE images api
            # Reclaim the images this deploy just superseded. Nothing on the VPS pruned
            # them before, so ~a dozen deploys in one day (three images each) filled
            # /dev/sda1 to 100% on 2026-07-31: Postgres crash-looped on "No space left on
            # device" and every data endpoint 500'd for ~15 minutes.
            #
            # Placed AFTER the swap so it can never remove the image about to start, and
            # `until=24h` rather than a bare `-af` so anything built in the last day stays
            # on the box: on a busy day — exactly when a rollback is most likely — the
            # previous SHA is still local and rolling back is a re-pin plus `up -d`. An
            # older target is still recoverable, it just re-pulls from GHCR first.
            # Non-fatal: a prune hiccup must never fail a deploy that already succeeded.
            # The disk report that follows is the check that it is working —
            # `Images TOTAL` should stop climbing deploy over deploy.
            docker image prune -af --filter "until=24h" || echo "image prune failed (non-fatal)" >&2
            df -h /
            docker system df
            # Reload Caddy so a just-shipped Caddyfile takes effect. A bind-mounted
            # file changing on disk does NOT make Caddy re-read it — only a reload
            # does. `caddy reload` validates the new config and, if it is invalid,
            # fails here while leaving the running config untouched, so the proxy
            # never drops. Runs every deploy (cheap, idempotent when unchanged) so
            # the live config always matches the shipped Caddyfile.
            $COMPOSE exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            # Post-deploy health check through Caddy from the host (the API
            # container exposes no host port and ships no wget/curl).
            set -a; . ./.env; set +a
            healthy=""
            for i in $(seq 1 30); do
              if curl -fsS "https://${SABRO_API_DOMAIN}/health" >/dev/null 2>&1; then
                healthy=1
                break
              fi
              echo "waiting for API health ($i)..."; sleep 2
            done
            if [ -z "$healthy" ]; then
              echo "API did not become healthy in time" >&2
              exit 1
            fi
            echo "API healthy"
            # Diagnostic: the puzzle endpoint must be public (200), not 401.
            echo "anon /play/meltho/today -> HTTP $(curl -s -o /dev/null -w '%{http_code}' "https://${SABRO_API_DOMAIN}/api/v1/play/meltho/today")"
            # Assert the running containers actually carry the commit we just
            # shipped — a green health check alone does not prove the swap
            # happened (a stale container also answers /health).
            expected="${{ needs.build-and-push.outputs.tag }}"
            for url in "https://${SABRO_API_DOMAIN}/version" "https://${SABRO_DOMAIN}/version"; do
              # Retry briefly: the frontend may still be booting when the API
              # health gate opens (both were just force-recreated together).
              deployed=$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "$url" || echo "unreachable")
              echo "$url -> $deployed"
              case "$deployed" in
                *"$expected"*) ;;
                *) echo "$url does not carry build $expected — stale container?" >&2; exit 1;;
              esac
            done
