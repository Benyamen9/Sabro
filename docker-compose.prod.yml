name: sabro-prod

# Production stack for the Sabro ecosystem hub on a single VPS (Hetzner CPX32).
# All services co-located behind Caddy. Images for the API/frontend/migrator are
# built in CI and pulled from GHCR (never built on the VPS). Secrets come from a
# `.env` next to this file on the VPS (see .env.prod.example) — never committed.
#
# Deploy order enforced by depends_on:
#   postgres (healthy) -> migrator (runs to completion) -> api -> caddy
#
# Bring up:  docker compose --env-file .env --env-file .env.deploy \
#              -f docker-compose.prod.yml up -d
# Migrate:   handled automatically by the `migrator` one-shot before `api` starts
#            (CD also runs it explicitly before swapping app containers).
#
# SABRO_IMAGE_TAG is REQUIRED, deliberately with no `:-latest` fallback. CD pins
# it to the deployed commit in `.env.deploy`. With a fallback, a hand-run
# `up -d` that forgot the env files silently resolved to whatever `:latest`
# happened to be cached locally — on 2026-07-28 that quietly rolled prod back to
# a two-week-old image while every health check stayed green. Failing loudly on
# a missing tag is strictly better than serving stale code.

services:
  postgres:
    image: postgres:17-alpine
    container_name: sabro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sabro}
      POSTGRES_USER: ${POSTGRES_USER:-sabro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Match dev: ICU locale provider for language-agnostic Unicode sorting.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sabro} -d ${POSTGRES_DB:-sabro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  meilisearch:
    image: getmeili/meilisearch:v1.51
    container_name: sabro-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_ENV: production
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      # Use 127.0.0.1, not localhost: inside this image localhost resolves to
      # IPv6 ::1 but Meilisearch binds IPv4 0.0.0.0 only, so a localhost probe
      # gets connection-refused and the container is wrongly marked unhealthy.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Self-hosted, cookieless web analytics. Chosen over Google Analytics so the
  # privacy policy's "no advertising, never sold" stance stays true and no
  # consent banner is needed: Umami sets no cookies and stores no personal data,
  # and everything lives on this box rather than a third party's.
  #
  # Shares the main Postgres instance but in its OWN database (`umami`), the
  # same way Logto keeps a store separate from ecosystem application data.
  # That database is deliberately NOT in the backup set — analytics is derived,
  # expendable, and not worth the restore surface.
  umami:
    # Pinned, not :latest. An unpinned image changes under you on any
    # `docker compose pull` — which is how the 2026-07-28 outage happened, when a
    # new Meilisearch engine refused the existing volume. Verified identical to
    # what was already running: digest sha256:8edfe4be… on 2026-08-07.
    #
    # Umami 3.x dropped the `postgresql-` tag prefix — the postgresql-v* series
    # stops at 2.20.2, so `postgresql-latest` was silently tracking 3.x. Plain
    # version tags are the 3.x naming.
    # To upgrade: pick a newer tag from ghcr.io/umami-software/umami and read the
    # release notes for schema migrations first.
    image: ghcr.io/umami-software/umami:3.3.1
    container_name: sabro-umami
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-sabro}:${POSTGRES_PASSWORD}@postgres:5432/umami"
      DATABASE_TYPE: postgresql
      # Signs Umami's own session tokens for the admin dashboard. Unrelated to
      # anything the tracker collects from visitors.
      #
      # Deliberately NOT `:?required`. A required variable fails compose at parse
      # time, so a deploy reaching a VPS whose .env lacks it would bring down the
      # entire stack rather than just this container — the same failure mode as
      # the 2026-07-28 outage. Unset, only Umami fails to start; the site serves.
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      # No telemetry back to the Umami project.
      DISABLE_TELEMETRY: "1"
    networks: [internal]

  seq:
    # Pinned, not :latest — same reasoning as umami above. Verified identical to
    # what was already running: digest sha256:91e93ff2… on 2026-08-07, which is
    # exactly what `latest`, `2026`, and `2026.1` all pointed at.
    #
    # NB the container's org.opencontainers.image.version label reads "24.04";
    # that is the Ubuntu base, NOT Seq's version. Seq's own tags look like
    # 2026.1.17083. Do not pin from that label.
    image: datalust/seq:2026.1.17114
    container_name: sabro-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Seq is internal-network-only (no Caddy route, no host port) — same
      # no-auth stance as local dev. Without this, a freshly created container
      # against an existing data volume with no admin user fails to boot:
      # "No default admin password was supplied".
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq-data:/data
    networks: [internal]

  logto-db:
    image: postgres:17-alpine
    container_name: sabro-logto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: logto
      POSTGRES_USER: logto
      POSTGRES_PASSWORD: ${LOGTO_DB_PASSWORD:?LOGTO_DB_PASSWORD is required}
    volumes:
      - logto-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logto -d logto"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  logto:
    # Pinned, never :latest. A newer Logto ships DB alterations the running
    # database has not applied, and Logto refuses to boot ("Found undeployed
    # database alterations") — a restart on :latest would silently crash-loop.
    # Bump deliberately: raise this tag, then run `npm run alteration deploy`.
    image: svhd/logto:1.42.0
    container_name: sabro-logto
    restart: unless-stopped
    depends_on:
      logto-db:
        condition: service_healthy
    environment:
      DB_URL: postgresql://logto:${LOGTO_DB_PASSWORD}@logto-db:5432/logto
      # Public HTTPS endpoints (served through Caddy). OIDC issuer must match.
      ENDPOINT: https://${LOGTO_DOMAIN}
      ADMIN_ENDPOINT: https://${LOGTO_ADMIN_DOMAIN}
      # Caddy terminates TLS and proxies to Logto over plain HTTP. Trust the
      # X-Forwarded-Proto header so Logto resolves the request origin as https
      # and matches ENDPOINT / ADMIN_ENDPOINT — otherwise the admin console
      # 404s ("page not found") behind the proxy.
      TRUST_PROXY_HEADER: "true"
    entrypoint:
      - sh
      - -c
      - "npm run cli db seed -- --swe && npm start"
    networks: [internal]

  # One-shot: applies every module's EF Core migrations, then exits. Behind the
  # "migrate" profile so it does NOT start with a plain `up -d`; CD runs it
  # explicitly before swapping app containers:
  #   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrator
  migrator:
    image: ghcr.io/${GHCR_OWNER:-benyamen9}/sabro-migrator:${SABRO_IMAGE_TAG:?SABRO_IMAGE_TAG is required. CD writes it to .env.deploy; run compose with --env-file .env --env-file .env.deploy}
    container_name: sabro-migrator
    profiles: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Sabro: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-sabro};Username=${POSTGRES_USER:-sabro};Password=${POSTGRES_PASSWORD}"
    networks: [internal]

  api:
    image: ghcr.io/${GHCR_OWNER:-benyamen9}/sabro-api:${SABRO_IMAGE_TAG:?SABRO_IMAGE_TAG is required. CD writes it to .env.deploy; run compose with --env-file .env --env-file .env.deploy}
    container_name: sabro-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # service_started, not service_healthy: SearchIndexInitializerHostedService
      # already treats Meilisearch as best-effort (catches and logs, never
      # crashes) since the API stays usable against Postgres alone. Gating on
      # health here defeats that — a Meilisearch outage (e.g. an engine
      # refusing an old data directory after a version bump) would otherwise
      # block `docker compose up -d` entirely and take api+frontend down with
      # it, as happened 2026-07-28.
      meilisearch:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Sabro: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-sabro};Username=${POSTGRES_USER:-sabro};Password=${POSTGRES_PASSWORD}"
      Logto__Authority: "https://${LOGTO_DOMAIN}/oidc"
      Logto__Audience: ${SABRO_API_RESOURCE:?SABRO_API_RESOURCE is required}
      # Machine-to-machine app with Logto Management API access, used by account
      # deletion to erase the caller's identity. Blank => deletion disabled.
      Logto__ManagementApi__ClientId: ${LOGTO_MANAGEMENT_CLIENT_ID:-}
      Logto__ManagementApi__ClientSecret: ${LOGTO_MANAGEMENT_CLIENT_SECRET:-}
      Meilisearch__Url: "http://meilisearch:7700"
      Meilisearch__MasterKey: ${MEILI_MASTER_KEY}
      # Browser-client origins allowed to call /api/v1 directly (hub + Meltho + Mno + Shmo).
      Cors__AllowedOrigins__0: "https://${SABRO_DOMAIN}"
      Cors__AllowedOrigins__1: "https://${MELTHO_DOMAIN:-localhost}"
      Cors__AllowedOrigins__2: "https://${MNO_DOMAIN:-localhost}"
      Cors__AllowedOrigins__3: "https://${SHMO_DOMAIN:-localhost}"
      Cors__AllowedOrigins__4: "https://${NAHLO_DOMAIN:-localhost}"
      # Ship structured logs to the co-located Seq.
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
    volumes:
      # Owner-uploaded media (pronunciation recordings, bibliography images) is
      # written to the container filesystem by FileSystemPronunciationAudioStorage.
      # Without this volume it lives only in the container's writable layer and is
      # destroyed by the next `docker compose up -d` — while the database keeps the
      # /media/... URL, leaving a dead link on the word page. The named volume
      # initializes from the image's wwwroot/media (which ships the pronunciations
      # directory), so it inherits the uid-1001 ownership the non-root API needs.
      - media-data:/app/wwwroot/media
    networks: [internal]

  frontend:
    image: ghcr.io/${GHCR_OWNER:-benyamen9}/sabro-frontend:${SABRO_IMAGE_TAG:?SABRO_IMAGE_TAG is required. CD writes it to .env.deploy; run compose with --env-file .env --env-file .env.deploy}
    container_name: sabro-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_LOGTO_ENDPOINT: "https://${LOGTO_DOMAIN}"
      NUXT_LOGTO_APP_ID: ${NUXT_LOGTO_APP_ID:?NUXT_LOGTO_APP_ID is required}
      NUXT_LOGTO_APP_SECRET: ${NUXT_LOGTO_APP_SECRET:?NUXT_LOGTO_APP_SECRET is required}
      NUXT_LOGTO_COOKIE_ENCRYPTION_KEY: ${NUXT_LOGTO_COOKIE_ENCRYPTION_KEY:?NUXT_LOGTO_COOKIE_ENCRYPTION_KEY is required}
      NUXT_PUBLIC_LOGTO_ENDPOINT: "https://${LOGTO_DOMAIN}"
      NUXT_PUBLIC_SABRO_API_RESOURCE: ${SABRO_API_RESOURCE}
      NUXT_PUBLIC_API_BASE_URL: "https://${SABRO_API_DOMAIN}/api/v1"
      # Shared cookie domain so locale + Syriac-script preferences carry across
      # the ecosystem (sabro.be + meltho.sabro.be + future apps). Must match the
      # value baked into the image at build time (CD build-arg).
      NUXT_PUBLIC_COOKIE_DOMAIN: "${COOKIE_DOMAIN:-.sabro.be}"
      # Cookieless analytics. BOTH must be set for the tracker to be injected;
      # the website id is issued by Umami's dashboard once the site is added
      # there, so it stays empty until that one-time step is done — which means
      # deploying this change tracks nothing until you opt in.
      NUXT_PUBLIC_UMAMI_URL: "${ANALYTICS_DOMAIN:+https://${ANALYTICS_DOMAIN}}"
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID:-}"
    networks: [internal]

  # Meltho — Syriac word game. Lives in its own repo (Hito/Meltho) and is built
  # into its own GHCR image, but runs as another container in this shared stack
  # behind the same Caddy, reading content + writing play results through the
  # Sabro API. It is its own Logto OIDC app (MELTHO_LOGTO_*), distinct from the
  # hub's. NUXT_PUBLIC_SABRO_API_RESOURCE is baked into the image at build time
  # (Meltho's CD passes it as a build arg); the value here must match.
  meltho:
    image: ghcr.io/${GHCR_OWNER:-benyamen9}/meltho:${MELTHO_IMAGE_TAG:-latest}
    container_name: sabro-meltho
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_LOGTO_ENDPOINT: "https://${LOGTO_DOMAIN}"
      NUXT_LOGTO_APP_ID: ${MELTHO_LOGTO_APP_ID:?MELTHO_LOGTO_APP_ID is required}
      NUXT_LOGTO_APP_SECRET: ${MELTHO_LOGTO_APP_SECRET:?MELTHO_LOGTO_APP_SECRET is required}
      NUXT_LOGTO_COOKIE_ENCRYPTION_KEY: ${MELTHO_LOGTO_COOKIE_ENCRYPTION_KEY:?MELTHO_LOGTO_COOKIE_ENCRYPTION_KEY is required}
      NUXT_PUBLIC_LOGTO_ENDPOINT: "https://${LOGTO_DOMAIN}"
      NUXT_PUBLIC_SABRO_API_RESOURCE: ${SABRO_API_RESOURCE}
      NUXT_PUBLIC_API_BASE_URL: "https://${SABRO_API_DOMAIN}/api/v1"
      # Same shared cookie domain as the hub frontend — this is what makes the
      # locale + script choice carry between Sabro and Meltho.
      NUXT_PUBLIC_COOKIE_DOMAIN: "${COOKIE_DOMAIN:-.sabro.be}"
    networks: [internal]

  # Mno — Syriac numbers game. Same shape as Meltho: own repo (Hito/Mno), own
  # GHCR image and CD, own Logto OIDC app (MNO_LOGTO_*), running as another
  # container in this shared stack behind the same Caddy. It reads the daily
  # equation and writes play results through the Sabro API only.
  mno:
    image: ghcr.io/${GHCR_OWNER:-benyamen9}/mno:${MNO_IMAGE_TAG:-latest}
    container_name: sabro-mno
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_LOGTO_ENDPOINT: "https://${LOGTO_DOMAIN}"
      NUXT_LOGTO_APP_ID: ${MNO_LOGTO_APP_ID:?MNO_LOGTO_APP_ID is required}
      NUXT_LOGTO_APP_SECRET: ${MNO_LOGTO_APP_SECRET:?MNO_LOGTO_APP_SECRET is required}
      NUXT_LOGTO_COOKIE_ENCRYPTION_KEY: ${MNO_LOGTO_COOKIE_ENCRYPTION_KEY:?MNO_LOGTO_COOKIE_ENCRYPTION_KEY is required}
      NUXT_PUBLIC_LOGTO_ENDPOINT: "https://${LOGTO_DOMAIN}"
      NUXT_PUBLIC_SABRO_API_RESOURCE: ${SABRO_API_RESOURCE}
      NUXT_PUBLIC_API_BASE_URL: "https://${SABRO_API_DOMAIN}/api/v1"
      # Same shared cookie domain as the hub and Meltho — locale + script
      # preferences carry across every app in the ecosystem.
      NUXT_PUBLIC_COOKIE_DOMAIN: "${COOKIE_DOMAIN:-.sabro.be}"
    networks: [internal]

  shmo:
    image: ghcr.io/${GHCR_OWNER:-benyamen9}/shmo:${SHMO_IMAGE_TAG:-latest}
    container_name: sabro-shmo
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_LOGTO_ENDPOINT: "https://${LOGTO_DOMAIN}"
      NUXT_LOGTO_APP_ID: ${SHMO_LOGTO_APP_ID:?SHMO_LOGTO_APP_ID is required}
      NUXT_LOGTO_APP_SECRET: ${SHMO_LOGTO_APP_SECRET:?SHMO_LOGTO_APP_SECRET is required}
      NUXT_LOGTO_COOKIE_ENCRYPTION_KEY: ${SHMO_LOGTO_COOKIE_ENCRYPTION_KEY:?SHMO_LOGTO_COOKIE_ENCRYPTION_KEY is required}
      NUXT_PUBLIC_LOGTO_ENDPOINT: "https://${LOGTO_DOMAIN}"
      NUXT_PUBLIC_SABRO_API_RESOURCE: ${SABRO_API_RESOURCE}
      NUXT_PUBLIC_API_BASE_URL: "https://${SABRO_API_DOMAIN}/api/v1"
      # Same shared cookie domain as the hub, Meltho and Mno — locale + script
      # preferences carry across every app in the ecosystem.
      NUXT_PUBLIC_COOKIE_DOMAIN: "${COOKIE_DOMAIN:-.sabro.be}"
    networks: [internal]

  nahlo:
    image: ghcr.io/${GHCR_OWNER:-benyamen9}/nahlo:${NAHLO_IMAGE_TAG:-latest}
    container_name: sabro-nahlo
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_LOGTO_ENDPOINT: "https://${LOGTO_DOMAIN}"
      NUXT_LOGTO_APP_ID: ${NAHLO_LOGTO_APP_ID:?NAHLO_LOGTO_APP_ID is required}
      NUXT_LOGTO_APP_SECRET: ${NAHLO_LOGTO_APP_SECRET:?NAHLO_LOGTO_APP_SECRET is required}
      NUXT_LOGTO_COOKIE_ENCRYPTION_KEY: ${NAHLO_LOGTO_COOKIE_ENCRYPTION_KEY:?NAHLO_LOGTO_COOKIE_ENCRYPTION_KEY is required}
      NUXT_PUBLIC_LOGTO_ENDPOINT: "https://${LOGTO_DOMAIN}"
      NUXT_PUBLIC_SABRO_API_RESOURCE: ${SABRO_API_RESOURCE}
      NUXT_PUBLIC_API_BASE_URL: "https://${SABRO_API_DOMAIN}/api/v1"
      # Same shared cookie domain as the hub and the other three games — locale
      # + script preferences carry across every app in the ecosystem.
      NUXT_PUBLIC_COOKIE_DOMAIN: "${COOKIE_DOMAIN:-.sabro.be}"
    networks: [internal]

  # Nightly logical backups of both databases (30 daily + 12 monthly), with
  # optional off-site sync to a Hetzner Storage Box and a weekly automated
  # restore test. Dumps live in the backup-data volume; off-site sync starts
  # once STORAGE_BOX_* is configured and ./secrets/storagebox_ed25519 exists.
  # Run on demand:  docker compose exec backup backup.sh
  # Restore runbook: see DEPLOY.md § Backups.
  #
  # Also carries the quarter-hourly disk-headroom check (disk-check.sh). It lives
  # here rather than in its own service because this container already runs cron
  # and already mounts a volume on the host filesystem, so it can read the real
  # partition numbers without a host mount or a Docker socket.
  # Run on demand:  docker compose exec backup disk-check.sh
  backup:
    image: ghcr.io/${GHCR_OWNER:-benyamen9}/sabro-backup:${SABRO_IMAGE_TAG:?SABRO_IMAGE_TAG is required. CD writes it to .env.deploy; run compose with --env-file .env --env-file .env.deploy}
    container_name: sabro-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      logto-db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sabro}
      POSTGRES_USER: ${POSTGRES_USER:-sabro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOGTO_DB_PASSWORD: ${LOGTO_DB_PASSWORD}
      # Off-site target (Hetzner Storage Box over SFTP). Blank => local-only.
      STORAGE_BOX_HOST: ${STORAGE_BOX_HOST:-}
      STORAGE_BOX_USER: ${STORAGE_BOX_USER:-}
      STORAGE_BOX_PORT: ${STORAGE_BOX_PORT:-23}
      STORAGE_BOX_REMOTE_DIR: ${STORAGE_BOX_REMOTE_DIR:-sabro-backups}
      # Optional heartbeat (e.g. healthchecks.io) — pinged after every backup,
      # <url>/fail on failure, so a dead backup job alerts instead of rotting.
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      # Disk headroom watch (disk-check.sh, every 15 min). Its own heartbeat, so a
      # full disk and a failed backup are distinguishable in the alert mail. UNSET
      # MEANS NO ALERT: the check still logs to `docker logs sabro-backup`, but
      # nothing emails, which is the state that let the disk reach 100% unnoticed
      # on 2026-07-31. Threshold is a percentage of the partition.
      DISK_HEARTBEAT_URL: ${DISK_HEARTBEAT_URL:-}
      DISK_USAGE_THRESHOLD: ${DISK_USAGE_THRESHOLD:-80}
    volumes:
      - backup-data:/backups
      # SSH key for the Storage Box lives on the VPS, never in the repo.
      - ./secrets:/run/secrets:ro
      # Owner-uploaded media, read-only. Recordings are original work — nothing
      # can regenerate them the way Meilisearch is rebuilt from Postgres — so
      # they are archived nightly alongside the database dumps. Read-only so a
      # bug in the backup job can never damage what it is protecting.
      - media-data:/media:ro
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    container_name: sabro-caddy
    restart: unless-stopped
    depends_on:
      - api
      - frontend
      - logto
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
      SABRO_DOMAIN: ${SABRO_DOMAIN}
      SABRO_API_DOMAIN: ${SABRO_API_DOMAIN}
      LOGTO_DOMAIN: ${LOGTO_DOMAIN}
      LOGTO_ADMIN_DOMAIN: ${LOGTO_ADMIN_DOMAIN}
      MELTHO_DOMAIN: ${MELTHO_DOMAIN}
      MNO_DOMAIN: ${MNO_DOMAIN}
      SHMO_DOMAIN: ${SHMO_DOMAIN}
      NAHLO_DOMAIN: ${NAHLO_DOMAIN}
      ANALYTICS_DOMAIN: ${ANALYTICS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    # Caddy now writes an access log line per request to stdout (see the
    # `accesslog` snippet in the Caddyfile). The json-file driver does not rotate
    # by default, so cap it here — otherwise every request in the ecosystem's
    # history accumulates on a 160 GB disk with nothing to trim it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  meilisearch-data:
  seq-data:
  logto-db-data:
  caddy-data:
  caddy-config:
  backup-data:
  media-data:
